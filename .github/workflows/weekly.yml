name: Weekrapportage

on:
  schedule:
    # 06:15 UTC maandag = 08:15 Amsterdam (zomertijd) / 07:15 (wintertijd).
    - cron: "15 6 * * 1"
  workflow_dispatch:
    inputs:
      week:
        description: "ISO-weeknummer. Leeg = vorige week."
        required: false
        type: string
      year:
        description: "Jaar (alleen samen met week)."
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt

      - name: Draai wekelijkse check + bouw site
        run: |
          if [ -n "${{ inputs.week }}" ]; then
            python build_site.py weekly --week "${{ inputs.week }}" --year "${{ inputs.year }}"
          else
            python build_site.py weekly
          fi

      - name: Commit rundata
        run: |
          git config user.name "regulatory-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "Geen nieuwe rundata."
          else
            git commit -m "Weekrapportage $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
